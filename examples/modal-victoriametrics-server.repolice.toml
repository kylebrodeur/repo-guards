# A real config example (the modal-* family's vm repo, 2026-10-15).
#
# Demonstrates the CENTRAL-NOTES pattern: the release notes live in the
# family's private docs home (an absolute path outside this repo), so the
# config points the parity gate there. A repo keeping its notes IN the
# repo uses a relative notes_dir instead.

owner = "kylebrodeur"
repo = "victoriametrics-server"
notes_dir = "/Users/you/workspace/your-family-system/docs/release/packages/victoriametrics-server"
